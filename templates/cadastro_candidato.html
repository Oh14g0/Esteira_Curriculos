{% extends "base.html" %}

{% block title %}Cadastro Candidato{% endblock %}

{% block content %}
<div class="flex items-center justify-center py-10">
  <div class="flex w-full max-w-4xl bg-white rounded-xl shadow-lg overflow-hidden">

    <!-- Lado esquerdo: Cadastro -->
    <div class="w-1/2 p-8">
      <h2 class="text-3xl font-bold text-[#7C71B2] text-center mb-4">Cadastro Candidato</h2>

      <form method="POST" class="space-y-4">
        <div>
          <label for="nome" class="sr-only">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Nome completo" required
                 class="w-full px-4 py-2 rounded-full bg-[#E1D8EB] placeholder-[#7C71B2] text-sm focus:outline-none">
        </div>

        <div>
          <label for="email" class="sr-only">Email</label>
          <input type="email" id="email" name="email" placeholder="E-mail" required
                 class="w-full px-4 py-2 rounded-full bg-[#E1D8EB] placeholder-[#7C71B2] text-sm focus:outline-none">
        </div>

        <div>
          <label for="telefone" class="sr-only">Telefone</label>
          <input type="tel" id="telefone" name="telefone" placeholder="Telefone" required
                 class="w-full px-4 py-2 rounded-full bg-[#E1D8EB] placeholder-[#7C71B2] text-sm focus:outline-none">
        </div>

        <div>
          <label for="linkedin" class="sr-only">LinkedIn</label>
          <input type="url" id="linkedin" name="linkedin" placeholder="LinkedIn" required
                 class="w-full px-4 py-2 rounded-full bg-[#E1D8EB] placeholder-[#7C71B2] text-sm focus:outline-none">
        </div>

        <div>
          <label for="endereco_completo" class="sr-only">Endereço</label>
          <input type="text" id="endereco_completo" name="endereco_completo" placeholder="Endereço completo" required
                 class="w-full px-4 py-2 rounded-full bg-[#E1D8EB] placeholder-[#7C71B2] text-sm focus:outline-none">
        </div>

        <div>
          <label for="pretensao_salarial" class="sr-only">Pretensão Salarial</label>
          <input type="number" id="pretensao_salarial" name="pretensao_salarial" placeholder="Pretensão Salarial (R$)" step="0.01" required
                 class="w-full px-4 py-2 rounded-full bg-[#E1D8EB] placeholder-[#7C71B2] text-sm focus:outline-none">
        </div>

        <div>
          <label for="senha" class="sr-only">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Senha" required minlength="6"
                 class="w-full px-4 py-2 rounded-full bg-[#E1D8EB] placeholder-[#7C71B2] text-sm focus:outline-none">
        </div>

        <button type="submit" class="w-full bg-[#7C71B2] hover:bg-purple-600 text-white font-bold py-2 rounded-full transition">
          Cadastrar
        </button>
      </form>

      <div class="mt-4 text-center">
        <a href="{{ url_for('login_candidato') }}" 
           class="text-[#7C71B2] hover:text-purple-600 transition-colors duration-200">
          Já tem conta? Faça login
        </a>
      </div>
    </div>

    <!-- Lado direito: Boas-vindas -->
    <div class="w-1/2 bg-[#7C71B2] text-white p-8 flex flex-col justify-center items-center rounded-r-[4rem]">
      <h1 class="text-4xl font-bold mb-4">Bem-vindo!</h1>
      <p class="mb-6 text-sm">Já possui uma conta? Faça seu login abaixo</p>
      <a
        href="{{ url_for('login_candidato') }}"
        class="bg-white text-[#7C71B2] px-6 py-2 rounded-full font-bold hover:bg-gray-100 transition"
      >
        Login
      </a>
      <a
        href="{{ url_for('cadastro_empresa') }}"
        class="mt-4 text-sm text-white underline hover:text-[#E1D8EB] transition-colors duration-200"
      >
        Sou empresa
      </a>
    </div>
  </div>
</div>
{% endblock %}
